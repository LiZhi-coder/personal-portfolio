services:
  portfolio-web:
    image: ${REGISTRY:?Set REGISTRY}/portfolio-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:80"
    networks: [front]

  boolcore-web:
    image: ${REGISTRY:?Set REGISTRY}/boolcore-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:80"
    networks: [front]

  boolcore-api:
    image: ${REGISTRY:?Set REGISTRY}/boolcore-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?Set HTTPS public IP origin}
    networks: [back]

networks:
  front:
  back:
